<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Đăng nhập</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body class="dark-theme">

<div id="main-navbar"></div>

<div class="auth-page">
  <a href="index.html" class="auth-back">← QUAY LẠI TRANG CHỦ</a>

  <div class="auth-container">
    <div class="auth-logo">🔥 Làng Nghề</div>
    <div class="auth-subtitle">KHÁM PHÁ DI SẢN</div>

    <h2 class="auth-title">Đăng nhập</h2>
    <p class="auth-desc">Bắt đầu hành trình khám phá làng nghề</p>

    <button class="btn-google" id="btn-google" onclick="googleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2a10.34 10.34 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92A8.78 8.78 0 0 0 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26a5.4 5.4 0 0 1-8.04-2.84H1.04v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M4 10.71a5.36 5.36 0 0 1 0-3.42V4.95H1.04A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04L4 10.72z"/><path fill="#EA4335" d="M9 3.58a4.86 4.86 0 0 1 3.44 1.35l2.58-2.59A8.65 8.65 0 0 0 9 0 9 9 0 0 0 1.04 4.96L4 7.3A5.36 5.36 0 0 1 9 3.58z"/></svg>
      Tiếp tục với Google
    </button>

    <div class="auth-divider">
      <span>HOẶC TIẾP TỤC VỚI</span>
    </div>

    <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
      <div class="auth-field">
        <label>EMAIL</label>
        <input type="email" id="login-email" placeholder="email@example.com" required />
      </div>
      <div class="auth-field">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <label>MẬT KHẨU</label>
          <a href="#" class="auth-link-sm">Quên mật khẩu?</a>
        </div>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <div id="login-error" class="auth-error"></div>
      <button type="submit" class="btn-auth-submit">KHÁM PHÁ NGAY</button>
    </form>

    <p class="auth-switch">
      Chưa có tài khoản? <a href="register.html">Tạo tài khoản</a>
    </p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.renderNavbar('login');
    if (App.isLoggedIn()) App.navigate('lobby.html');
  });

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const result = App.login(email, password);
    if (result.success) {
      App.navigate('lobby.html');
    } else {
      document.getElementById('login-error').textContent = result.error;
    }
  }

  function googleLogin() {
    App.loginWithGoogle();
    App.navigate('lobby.html');
  }
</script>
</body>
</html>
