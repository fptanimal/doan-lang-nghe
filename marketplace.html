<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Marketplace</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    /* Specific Marketplace Styling */
    .ecommerce-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      gap: 2rem;
    }
    
    .village-sidebar {
      width: 280px;
      flex-shrink: 0;
      position: sticky;
      top: 100px;
      height: max-content;
      background: var(--white);
      border: 1px solid var(--cream-dark);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .village-sidebar h3 {
      color: var(--terracotta);
      margin-bottom: 1.5rem;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: var(--font-display);
    }

    .village-nav-item {
      display: block;
      padding: 1rem 1.2rem;
      color: var(--ink);
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      font-weight: 600;
      border-left: 3px solid transparent;
    }

    .village-nav-item:hover, .village-nav-item.active {
      background: rgba(185, 69, 40, 0.05);
      color: var(--terracotta);
      border-left-color: var(--terracotta);
    }

    .ecommerce-main {
      flex: 1;
    }

    .village-section {
      margin-bottom: 4rem;
      scroll-margin-top: 100px;
    }

    .village-section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--cream-dark);
    }

    .village-section-header h2 {
      font-size: 2rem;
      margin: 0;
      color: var(--terracotta);
      font-family: var(--font-display);
    }

    .village-badge {
      background: var(--terracotta);
      color: var(--white);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
    }

    .eco-card {
      background: var(--white);
      border: 1px solid var(--cream-dark);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    .eco-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(185, 69, 40, 0.1);
      border-color: rgba(185, 69, 40, 0.3);
    }

    .eco-card-img {
      width: 100%;
      height: 250px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .eco-card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .eco-card-title {
      font-size: 1.1rem;
      margin: 0 0 0.5rem 0;
      color: var(--ink);
      line-height: 1.4;
      font-family: var(--font-display);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .eco-card-artisan {
      font-size: 0.9rem;
      color: var(--gray);
      margin-bottom: 1rem;
    }

    .eco-card-price {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--terracotta);
      margin-top: auto;
      margin-bottom: 1.5rem;
    }

    .eco-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    
    .eco-btn-group .btn {
      padding: 0.6rem 0.5rem;
      font-size: 0.9rem;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Modal Styling adjustments for E-commerce */
    .product-modal-box {
      max-width: 900px;
      width: 90%;
      background: var(--white);
      color: var(--ink);
      border: 1px solid var(--cream-dark);
      border-radius: var(--radius-lg);
    }
    
    .eco-modal-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .eco-modal-img {
      width: 100%;
      height: 100%;
      min-height: 400px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
    }

    .eco-modal-info {
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
    }

    .eco-modal-title {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      font-family: var(--font-display);
      color: var(--terracotta);
    }

    .eco-modal-price {
      font-size: 2rem;
      color: var(--terracotta);
      font-weight: bold;
      margin: 1.5rem 0;
    }

    .eco-modal-desc {
      color: var(--gray);
      line-height: 1.6;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    
    .eco-trust-badges {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: rgba(185, 69, 40, 0.05);
      border-radius: 8px;
    }
    
    .trust-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--ink);
      font-weight: 500;
    }

    @media (max-width: 992px) {
      .ecommerce-container {
        flex-direction: column;
      }
      .village-sidebar {
        width: 100%;
        position: static;
        display: flex;
        overflow-x: auto;
        padding: 1rem;
        margin-bottom: 2rem;
      }
      .village-sidebar h3 {
        display: none;
      }
      .village-nav-item {
        white-space: nowrap;
        margin: 0 0.5rem 0 0;
        border-left: none;
        border-bottom: 3px solid transparent;
      }
      .village-nav-item.active {
        border-left: none;
        border-bottom-color: var(--terracotta);
      }
      .eco-modal-content {
        grid-template-columns: 1fr;
      }
      .eco-modal-img {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
<div class="bg-pattern"></div>
<div id="main-navbar"></div>

<div class="page-wrapper marketplace-page">
  <!-- Header -->
  <div class="mp-header" style="padding-bottom: 2rem; text-align: center;">
    <h1 class="mp-title" style="color: var(--terracotta);">Sàn Thương Mại Làng Nghề</h1>
    <p class="mp-desc" style="color: var(--gray);">Khám phá và sở hữu những tuyệt tác thủ công tinh xảo nhất từ các làng nghề truyền thống Việt Nam</p>
  </div>

  <div class="ecommerce-container">
    <!-- Sidebar Navigation -->
    <aside class="village-sidebar">
      <h3>Gian hàng Làng nghề</h3>
      <div id="village-nav-container">
        <!-- Filled by JS -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="ecommerce-main" id="ecommerce-main">
      <!-- Filled by JS -->
    </main>
  </div>
</div>

<!-- Product Detail Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box product-modal-box">
    <button class="modal-close" onclick="closeProductModal()">✕</button>
    <div class="eco-modal-content" id="product-modal-content">
      <!-- Filled by JS -->
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.renderNavbar('marketplace');
    renderEcommercePlatform();
  });

  function renderEcommercePlatform() {
    const navContainer = document.getElementById('village-nav-container');
    const mainContainer = document.getElementById('ecommerce-main');
    
    // We will render sections for each village that actually has products
    const villagesWithProducts = VILLAGES.filter(v => v.products && v.products.length > 0);
    
    let navHTML = '';
    let mainHTML = '';

    villagesWithProducts.forEach((village, index) => {
      const sectionId = `village-section-${village.id}`;
      
      // Build Sidebar Nav
      navHTML += `
        <a href="#${sectionId}" class="village-nav-item ${index === 0 ? 'active' : ''}" data-target="${sectionId}">
          🏮 ${village.name}
        </a>
      `;

      // Build Main Section
      mainHTML += `
        <section class="village-section" id="${sectionId}">
          <div class="village-section-header">
            <h2>${village.name}</h2>
            <span class="village-badge">${village.products.length} sản phẩm</span>
          </div>
          <div class="product-grid">
            ${village.products.map((p, i) => `
              <div class="eco-card" style="animation-delay: ${i * 0.05}s">
                <div class="eco-card-img" style="background-image:url('${p.image || 'images/placeholder.jpg'}')"></div>
                <div class="eco-card-body">
                  <h3 class="eco-card-title">${p.name}</h3>
                  <p class="eco-card-artisan">👤 ${p.artisan}</p>
                  <div class="eco-card-price">${formatPrice(p.price)}</div>
                  <div class="eco-btn-group">
                    <button class="btn btn-secondary" onclick="openProductModal('${p.id}')">Xem thêm</button>
                    <button class="btn btn-primary" onclick="addToCart('${p.id}')">Mua ngay</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    });

    navContainer.innerHTML = navHTML;
    mainContainer.innerHTML = mainHTML;

    // Handle scroll spy for sidebar active state
    setupScrollSpy();
  }

  function setupScrollSpy() {
    const sections = document.querySelectorAll('.village-section');
    const navItems = document.querySelectorAll('.village-nav-item');

    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.clientHeight;
        if (pageYOffset >= (sectionTop - 200)) {
          current = section.getAttribute('id');
        }
      });

      navItems.forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('href').substring(1) === current) {
          item.classList.add('active');
        }
      });
    });

    // Handle click on nav items for smooth scroll
    navItems.forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetSection = document.getElementById(targetId);
        window.scrollTo({
          top: targetSection.offsetTop - 80,
          behavior: 'smooth'
        });
      });
    });
  }

  function openProductModal(productId) {
    const p = getProductById(productId);
    if (!p) return;
    
    const modal = document.getElementById('product-modal');
    const content = document.getElementById('product-modal-content');
    const village = getVillageById(p.villageId);

    content.innerHTML = `
      <div class="eco-modal-img" style="background-image:url('${p.image || 'images/placeholder.jpg'}')"></div>
      <div class="eco-modal-info">
        <div style="margin-bottom: 1rem;">
          <span class="village-badge">📍 ${p.villageName}</span>
        </div>
        <h2 class="eco-modal-title">${p.name}</h2>
        <p style="color: #aaa; font-size: 1.1rem; margin-bottom: 0.5rem;">Cung cấp bởi: <strong>${p.artisan}</strong></p>
        
        <div class="eco-modal-price">${formatPrice(p.price)}</div>
        
        <div class="eco-trust-badges">
          <div class="trust-badge">✅ Chính hãng 100%</div>
          <div class="trust-badge">📦 Giao hàng toàn quốc</div>
          <div class="trust-badge">🛡️ Đổi trả 7 ngày</div>
        </div>

        <h4 style="color: var(--ink); margin-bottom: 0.5rem; font-size: 1.2rem; font-family: var(--font-display);">Thông tin chi tiết</h4>
        <p class="eco-modal-desc">${p.desc}</p>
        
        ${village ? `
          <div style="background: rgba(185,69,40,0.05); padding: 1rem; border-radius: 8px; margin-bottom: 2rem; border-left: 4px solid var(--terracotta);">
            <h4 style="color: var(--terracotta); margin-bottom: 0.5rem; font-family: var(--font-display);">Về ${village.name}</h4>
            <p style="font-size: 0.95rem; color: var(--gray); margin: 0;">${village.description}</p>
          </div>
        ` : ''}

        <div style="display: flex; gap: 1rem; margin-top: auto;">
          <button class="btn btn-primary btn-lg" style="flex: 2;" onclick="addToCart('${p.id}')">Thêm vào giỏ hàng</button>
          <button class="btn btn-secondary btn-lg" style="flex: 1;" onclick="closeProductModal()">Đóng</button>
        </div>
      </div>
    `;
    modal.classList.add('open');
  }

  function closeProductModal() {
    document.getElementById('product-modal').classList.remove('open');
  }

  function addToCart(productId) {
    if (!App.isLoggedIn()) {
      if (confirm('Bạn cần đăng nhập để thêm sản phẩm vào giỏ hàng. Đăng nhập ngay?')) {
        window.location.href = 'login.html?redirect=marketplace.html';
      }
      return;
    }
    Cart.add(productId);
    closeProductModal();
  }

  // Close modal on click outside
  document.getElementById('product-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeProductModal();
  });
</script>
<script src="js/cart.js"></script>
</body>
</html>
