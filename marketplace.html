<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Marketplace</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/upgrade.css" />
  <style>
    /* Specific Marketplace Styling */
    .ecommerce-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      gap: 2rem;
    }
    
    .village-sidebar {
      width: 280px;
      flex-shrink: 0;
      position: sticky;
      top: 100px;
      height: max-content;
      padding: 1.5rem;
    }

    .village-sidebar h3 {
      color: var(--terracotta);
      margin-bottom: 1.5rem;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: var(--font-display);
    }

    .village-nav-item {
      display: block;
      padding: 1rem 1.2rem;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      border-radius: 12px;
      margin-bottom: 0.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      font-weight: 600;
    }

    .village-nav-item:hover, .village-nav-item.active {
      background: rgba(192, 83, 58, 0.2);
      color: var(--gold-light);
      transform: translateX(5px);
    }

    .ecommerce-main {
      flex: 1;
    }

    .village-section {
      margin-bottom: 4rem;
      scroll-margin-top: 100px;
    }

    .village-section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .village-section-header h2 {
      font-size: 2rem;
      margin: 0;
      color: var(--gold-light);
      font-family: var(--font-display);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .eco-card-img {
      width: 100%;
      height: 250px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .eco-card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .eco-card-title {
      font-size: 1.2rem;
      margin: 0 0 0.5rem 0;
      color: #fff;
      line-height: 1.4;
      font-family: var(--font-display);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .eco-card-artisan {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 1rem;
    }

    .eco-card-price {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--terracotta);
      margin-top: auto;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 10px rgba(192, 83, 58, 0.3);
    }

    .eco-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    
    .eco-btn-group .btn {
      padding: 0.8rem 0.5rem;
      font-size: 0.95rem;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
    }

    /* Premium Modal Styling */
    .product-modal-box {
      max-width: 1000px;
      width: 90%;
      background: rgba(11, 8, 7, 0.95);
      backdrop-filter: blur(20px);
      color: #f2eee8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .3s;
    }
    .modal-close:hover {
      background: rgba(192, 83, 58, 0.8);
      border-color: rgba(192, 83, 58, 1);
    }

    .eco-modal-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .eco-modal-img {
      width: 100%;
      height: 100%;
      min-height: 500px;
      background-size: cover;
      background-position: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .eco-modal-info {
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .eco-modal-title {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-family: var(--font-display);
      color: var(--gold-light);
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }

    .eco-modal-price {
      font-size: 2.2rem;
      color: var(--terracotta);
      font-weight: bold;
      margin: 1.5rem 0;
      text-shadow: 0 0 15px rgba(192, 83, 58, 0.4);
    }

    .eco-modal-desc {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.8;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    
    .eco-trust-badges {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
    }
    
    .trust-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .mp-hero-banner {
      height: 400px;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 80px; /* Offset for navbar */
    }

    .mp-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11,8,7,0.8) 0%, rgba(11,8,7,0.4) 50%, rgba(11,8,7,0.9) 100%);
    }

    .mp-hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      padding: 0 24px;
    }

    @media (max-width: 992px) {
      .ecommerce-container { flex-direction: column; }
      .village-sidebar { width: 100%; position: static; display: flex; overflow-x: auto; padding: 1rem; margin-bottom: 2rem; }
      .village-sidebar h3 { display: none; }
      .village-nav-item { white-space: nowrap; margin: 0 0.5rem 0 0; }
      .eco-modal-content { grid-template-columns: 1fr; }
      .eco-modal-img { min-height: 300px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    }
  </style>
</head>
<body class="dark-theme">
<div class="bg-pattern"></div>
<div id="main-navbar"></div>

<div class="page-wrapper marketplace-page" style="padding-top: 0;">
  
  <!-- Premium Hero Banner -->
  <div class="mp-hero-banner" style="background-image: url('images/marketplace_hero_bg.png');">
    <div class="mp-hero-overlay"></div>
    <div class="mp-hero-content">
      <h1 class="mp-title text-glow" style="color: var(--gold-light); font-size: 3.5rem; margin-bottom: 16px;">Tuyệt Tác Thủ Công</h1>
      <p class="mp-desc text-muted" style="font-size: 1.2rem; line-height: 1.6;">Khám phá và sở hữu những kiệt tác nghệ thuật tinh xảo nhất từ các bàn tay nghệ nhân hàng đầu của các làng nghề truyền thống Việt Nam.</p>
    </div>
  </div>

  <div class="ecommerce-container">
    <!-- Sidebar Navigation -->
    <aside class="village-sidebar glass-panel">
      <h3>Gian hàng Làng nghề</h3>
      <div id="village-nav-container">
        <!-- Filled by JS -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="ecommerce-main" id="ecommerce-main">
      <!-- Filled by JS -->
    </main>
  </div>
</div>

<!-- Product Detail Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box product-modal-box" style="padding: 0;">
    <button class="modal-close" onclick="closeProductModal()">✕</button>
    <div class="eco-modal-content" id="product-modal-content">
      <!-- Filled by JS -->
    </div>
  </div>
</div>

<script type="module" src="js/firebase-auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.renderNavbar('marketplace');
    renderEcommercePlatform();
  });

  function renderEcommercePlatform() {
    const navContainer = document.getElementById('village-nav-container');
    const mainContainer = document.getElementById('ecommerce-main');
    
    // We will render sections for each village that actually has products
    const villagesWithProducts = VILLAGES.filter(v => v.products && v.products.length > 0);
    
    let navHTML = '';
    let mainHTML = '';

    villagesWithProducts.forEach((village, index) => {
      const sectionId = `village-section-${village.id}`;
      
      // Build Sidebar Nav
      navHTML += `
        <a href="#${sectionId}" class="village-nav-item ${index === 0 ? 'active' : ''}" data-target="${sectionId}">
          🏮 ${village.name}
        </a>
      `;

      // Build Main Section
      mainHTML += `
        <section class="village-section" id="${sectionId}">
          <div class="village-section-header">
            <h2>${village.name}</h2>
            <span class="glass-badge" style="padding: 6px 16px; border-radius: 20px; font-weight: bold;">${village.products.length} sản phẩm</span>
          </div>
          <div class="product-grid">
            ${village.products.map((p, i) => `
              <div class="eco-card glass-panel" style="animation-delay: ${i * 0.05}s">
                <div class="eco-card-img" style="background-image:url('${p.image || 'images/placeholder.jpg'}')"></div>
                <div class="eco-card-body">
                  <h3 class="eco-card-title">${p.name}</h3>
                  <p class="eco-card-artisan">👤 ${p.artisan}</p>
                  <div class="eco-card-price">${formatPrice(p.price)}</div>
                  <div class="eco-btn-group">
                    <button class="btn glass-btn" style="border: 1px solid rgba(255,255,255,0.2);" onclick="openProductModal('${p.id}')">Xem chi tiết</button>
                    <button class="btn btn-primary btn-glow" onclick="addToCart('${p.id}')">Mua ngay</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    });

    navContainer.innerHTML = navHTML;
    mainContainer.innerHTML = mainHTML;

    // Handle scroll spy for sidebar active state
    setupScrollSpy();
  }

  function setupScrollSpy() {
    const sections = document.querySelectorAll('.village-section');
    const navItems = document.querySelectorAll('.village-nav-item');

    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.clientHeight;
        if (pageYOffset >= (sectionTop - 200)) {
          current = section.getAttribute('id');
        }
      });

      navItems.forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('href').substring(1) === current) {
          item.classList.add('active');
        }
      });
    });

    // Handle click on nav items for smooth scroll
    navItems.forEach(item => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetSection = document.getElementById(targetId);
        window.scrollTo({
          top: targetSection.offsetTop - 80,
          behavior: 'smooth'
        });
      });
    });
  }

  function openProductModal(productId) {
    const p = getProductById(productId);
    if (!p) return;
    
    const modal = document.getElementById('product-modal');
    const content = document.getElementById('product-modal-content');
    const village = getVillageById(p.villageId);

    content.innerHTML = `
      <div class="eco-modal-img" style="background-image:url('${p.image || 'images/placeholder.jpg'}')"></div>
      <div class="eco-modal-info">
        <div style="margin-bottom: 1rem;">
          <span class="glass-badge" style="padding: 6px 16px; border-radius: 20px;">📍 ${p.villageName}</span>
        </div>
        <h2 class="eco-modal-title text-glow">${p.name}</h2>
        <p style="color: rgba(255,255,255,0.6); font-size: 1.1rem; margin-bottom: 0.5rem;">Được chế tác bởi nghệ nhân: <strong style="color: white;">${p.artisan}</strong></p>
        
        <div class="eco-modal-price text-glow">${formatPrice(p.price)}</div>
        
        <div class="eco-trust-badges">
          <div class="trust-badge">✨ Kiệt tác tinh xảo</div>
          <div class="trust-badge">📦 Vận chuyển đảm bảo</div>
          <div class="trust-badge">🛡️ Xác thực nguồn gốc</div>
        </div>

        <h4 style="color: var(--gold-light); margin-bottom: 0.8rem; font-size: 1.3rem; font-family: var(--font-display);">Câu chuyện tác phẩm</h4>
        <p class="eco-modal-desc">${p.desc}</p>
        
        ${village ? `
          <div class="glass-panel" style="padding: 1.5rem; margin-bottom: 2rem; border-left: 4px solid var(--terracotta);">
            <h4 style="color: var(--terracotta); margin-bottom: 0.5rem; font-family: var(--font-display); font-size: 1.2rem;">Về ${village.name}</h4>
            <p style="font-size: 0.95rem; color: rgba(255,255,255,0.7); margin: 0; line-height: 1.6;">${village.description}</p>
          </div>
        ` : ''}

        <div style="display: flex; gap: 1rem; margin-top: auto;">
          <button class="btn btn-primary btn-lg btn-glow" style="flex: 2; border-radius: 16px;" onclick="addToCart('${p.id}')">Thêm vào bộ sưu tập</button>
        </div>
      </div>
    `;
    modal.classList.add('open');
  }

  function closeProductModal() {
    document.getElementById('product-modal').classList.remove('open');
  }

  function addToCart(productId) {
    if (!App.isLoggedIn()) {
      if (confirm('Bạn cần đăng nhập để thêm sản phẩm vào giỏ hàng. Đăng nhập ngay?')) {
        window.location.href = 'login.html?redirect=marketplace.html';
      }
      return;
    }
    Cart.add(productId);
    closeProductModal();
  }

  // Close modal on click outside
  document.getElementById('product-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeProductModal();
  });
</script>
<script src="js/cart.js"></script>
</body>
</html>
