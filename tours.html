<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Đặt Tour Khám Phá</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .tours-header {
      text-align: center;
      padding: 80px 20px 60px;
      background: linear-gradient(rgba(253, 251, 247, 0.85), rgba(253, 251, 247, 0.95)), url('images/Làng nghề mây tre đan.jpg') center/cover;
      color: var(--ink);
      border-bottom: 1px solid var(--cream-dark);
    }
    .tours-title {
      font-size: 3rem;
      font-family: var(--font-display);
      color: var(--terracotta);
      margin-bottom: 16px;
      font-weight: 800;
    }
    .tours-desc {
      font-size: 1.15rem;
      max-width: 650px;
      margin: 0 auto;
      color: var(--gray);
      line-height: 1.6;
    }
    .tours-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      padding: 40px 0;
    }
    .tour-card {
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid var(--cream-dark);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }
    .tour-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(192, 83, 58, 0.1);
      border-color: rgba(192, 83, 58, 0.3);
    }
    .tour-img {
      width: 100%;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .tour-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--terracotta);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .tour-body {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .tour-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--font-display);
    }
    .tour-village {
      font-size: 0.9rem;
      color: var(--terracotta);
      margin-bottom: 12px;
    }
    .tour-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 16px;
      font-weight: 500;
    }
    .tour-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tour-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
      flex-grow: 1;
    }
    .tour-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .tour-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--terracotta);
    }
    
    /* Booking Modal */
    .booking-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .booking-modal.open {
      display: flex;
      animation: fadeIn 0.3s ease-out;
    }
    .booking-box {
      background: var(--white);
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 32px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      border: 1px solid var(--cream-dark);
      color: var(--ink);
    }
    .close-modal {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: inherit;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--cream-dark);
      border-radius: 8px;
      font-family: inherit;
      background: var(--white);
      color: var(--ink);
      transition: 0.2s;
    }
    .form-input:focus {
      border-color: var(--terracotta);
      outline: none;
      box-shadow: 0 0 0 3px rgba(192, 83, 58, 0.1);
    }
  </style>
</head>
<body class="light-theme">

<div id="main-navbar"></div>

<div class="page-wrapper">
  <div class="tours-header">
    <div class="container">
      <h1 class="tours-title">Hành Trình Khám Phá Làng Nghề</h1>
      <p class="tours-desc">Đến tận nơi, cảm nhận bằng mọi giác quan và tự tay làm nên những sản phẩm truyền thống cùng các nghệ nhân.</p>
    </div>
  </div>

  <div class="container" style="margin-top: 40px;">
    <!-- Filter -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
      <h2 style="font-family:var(--font-display); color:var(--terracotta);">Danh sách Tour</h2>
      <select id="village-filter" class="form-input" style="width:auto; min-width:200px;" onchange="filterTours()">
        <option value="all">Tất cả làng nghề</option>
        <!-- Lấp đầy bằng JS -->
      </select>
    </div>

    <!-- Grid -->
    <div class="tours-grid" id="tours-grid">
      <!-- Lấp đầy bằng JS -->
    </div>
  </div>
</div>

<!-- Booking Modal -->
<div class="booking-modal" id="booking-modal">
  <div class="booking-box">
    <button class="close-modal" onclick="closeModal()">✕</button>
    <h3 style="font-family:var(--font-display); color:var(--terracotta); margin-bottom:8px; font-size:1.8rem;" id="modal-tour-name">Tên Tour</h3>
    <p style="color:var(--terracotta); margin-bottom:24px; font-weight:bold;" id="modal-tour-price">0đ</p>
    
    <form id="booking-form" onsubmit="submitBooking(event)">
      <div class="form-group">
        <label class="form-label">Họ và tên</label>
        <input type="text" class="form-input" required placeholder="Nhập họ tên của bạn">
      </div>
      <div class="form-group">
        <label class="form-label">Số điện thoại</label>
        <input type="tel" class="form-input" required placeholder="Ví dụ: 0912345678">
      </div>
      <div class="form-group">
        <label class="form-label">Ngày khởi hành dự kiến</label>
        <input type="date" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">Số lượng khách</label>
        <input type="number" class="form-input" min="1" value="1" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px; padding:14px; font-size:1.1rem;">Xác nhận Đặt Tour</button>
    </form>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/tours.js"></script>
</body>
</html>
