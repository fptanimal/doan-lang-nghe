<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Thử thách</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
</head>
<body>

<!-- CURTAIN ANIMATION -->
<div class="curtain-container" id="page-curtain">
  <div class="curtain-panel"></div>
  <div class="curtain-panel right"></div>
</div>

<div class="hg-fullscreen">
  <!-- Dynamic Background -->
  <div class="hg-dynamic-bg" id="dynamic-game-bg"></div>

  <!-- VR Button (Top Right) -->
  <button id="vr-btn" class="hg-vr-btn-top" style="display:none;" onclick="openVR()">👁️ Xem VR 360°</button>

  <!-- Exit Button -->
  <button class="hg-exit-btn" onclick="document.getElementById('exit-modal').classList.add('open')">
    🚪 Thoát
  </button>

  <!-- Top Left Panel (Progress & Score) -->
  <div class="hg-top-left-panel">
    <div class="hg-rank-title">Thử thách Làng Nghề</div>
    <div class="hg-main-title">Khám Phá Di Sản</div>
    
    <!-- Segmented Progress Bar -->
    <div class="hg-progress-bar" id="hg-progress-bar">
      <!-- Generated by JS -->
    </div>
    
    <div class="hg-score-row">
      <span>Điểm số</span>
      <span class="hg-score-value" id="score">0</span>
    </div>
    <div class="hg-score-row" style="margin-top:4px;">
      <span>Chuỗi thắng</span>
      <span class="hg-score-value" style="color:white;"><span id="streak-count">0</span> 🔥</span>
    </div>
    <div class="hg-score-row" style="margin-top:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:4px;">
      <span>⏱ Thời gian</span>
      <span class="hg-score-value" style="color:#FF4D4D;" id="timer-value">30</span>
    </div>
  </div>

  <!-- Mascot Panel (Bottom Right) -->
  <div class="hg-mascot-panel">
    <div class="hg-mascot-header">
      <div class="hg-mascot-title">🔥 Hỏa Đồng Hành</div>
      <button class="hg-hint-btn" onclick="useHint()">💡 Xin gợi ý</button>
    </div>
    <div id="mascot-container" class="mascot-container" style="transform: scale(1.1); margin-top:16px;"></div>
  </div>

  <!-- Bottom Bar (Input & Guess) -->
  <div class="hg-bottom-bar-container" id="hg-bottom-container">
    <div id="hg-hint-display" style="text-align: center; color: #fff; margin-bottom: 12px; font-weight: 600; font-size: 1.1rem; text-shadow: 0 2px 8px rgba(0,0,0,0.8); background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(232, 184, 75, 0.5); display: inline-block; width: 100%;">
      <!-- Hint appears here -->
    </div>
    <form id="answer-form" class="hg-input-bar">
      <input type="text" id="answer-input" class="hg-input-field" placeholder="Nhập tên làng nghề, đình chùa, hoặc vùng đất..." autocomplete="off" />
      <button type="submit" id="submit-answer-btn" class="hg-guess-btn">ĐOÁN ⤏</button>
    </form>
    <div style="text-align:right; margin-top:8px;">
      <button class="hg-hint-btn" id="skip-btn" onclick="skipQuestion()">Bỏ qua →</button>
    </div>
  </div>

  <!-- Result Area (Hidden by default, shown over background) -->
  <div id="result-area" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(255, 255, 255, 0.95); backdrop-filter:blur(20px); padding:32px; border-radius:16px; border:1px solid rgba(0,0,0,0.08); z-index:50; color:var(--ink); text-align:center; max-width:600px; width:90%; box-shadow:0 20px 50px rgba(0,0,0,0.15); max-height:90vh; overflow-y:auto;">
    <h2 id="reveal-name" style="font-family:var(--font-display); font-size:2.5rem; color:var(--terracotta); margin-bottom:8px;">Tên Làng</h2>
    <div id="reveal-location" style="color:var(--gray); font-size:1.1rem; margin-bottom:16px;">📍 Vị trí</div>
    
    <div id="reveal-video-container" style="display:none; width:100%; border-radius:12px; overflow:hidden; aspect-ratio:16/9; margin-bottom:16px; background:#000; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
      <iframe id="reveal-video" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="width:100%; height:100%;"></iframe>
    </div>

    <p id="reveal-desc" style="line-height:1.6; color:var(--gray); margin-bottom:16px; font-size:0.95rem;"></p>
    <div id="reveal-fact" style="background:rgba(232, 184, 75, 0.15); padding:12px; border-radius:12px; font-size:0.85rem; color:var(--gold-dark); margin-bottom:24px; border:1px solid rgba(232, 184, 75, 0.3);">💡 Fact</div>
    
    <div id="game-marketplace-suggest" style="display:none; margin-bottom:24px;">
      <h4 style="color:var(--terracotta); margin-bottom:12px; font-size:0.9rem; text-transform:uppercase;">🛒 Sản phẩm làng nghề</h4>
      <div id="suggest-products" style="display:flex; flex-direction:column; gap:12px; align-items:center;"></div>
    </div>
    
    <button class="hg-guess-btn" id="next-btn" style="width:100%; font-size:1.1rem; padding:14px; margin-top:12px;" onclick="nextQuestion()">Câu tiếp theo ⟶</button>
  </div>
</div>

<!-- Exit confirm -->
<div class="modal-overlay" id="exit-modal">
  <div class="modal-box">
    <div style="font-size:2.5rem;margin-bottom:12px">🚪</div>
    <h2 style="margin-bottom:8px">Thoát trò chơi?</h2>
    <p style="margin-bottom:24px">Tiến trình hiện tại sẽ không được lưu.</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn btn-secondary" onclick="document.getElementById('exit-modal').classList.remove('open')">Tiếp tục chơi</button>
      <button class="btn btn-primary" onclick="window.location.href='lobby.html'">Thoát</button>
    </div>
  </div>
</div>

<!-- VR Modal Fullscreen -->
<div class="modal-overlay" id="vr-modal" style="background: #000; z-index:999;">
  <button class="modal-close" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.5); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; border: 1px solid rgba(255,255,255,0.2);" onclick="closeVR()">✕</button>
  <div id="vr-panorama" style="width: 100vw; height: 100vh;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/mascot.js"></script>
<script src="js/vr360.js"></script>
<script src="js/game.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    Mascot.init('mascot-container');
    Game.init();

    // Open curtain animation
    setTimeout(() => {
      document.getElementById('page-curtain').classList.add('open');
    }, 100);
  });

  document.getElementById('vr-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeVR();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeVR();
    }
  });

  function openVR(url) {
    if(!url) url = window.currentPanoramaUrl;
    if(!url) return;
    document.getElementById('vr-modal').classList.add('open');
    if (typeof VR360 !== 'undefined') VR360.init('vr-panorama', url);
  }

  function closeVR() {
    document.getElementById('vr-modal').classList.remove('open');
    if (typeof VR360 !== 'undefined') VR360.destroy();
  }
</script>
</body>
</html>
