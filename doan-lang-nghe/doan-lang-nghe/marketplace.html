<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Marketplace</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
<div class="bg-pattern"></div>
<div id="main-navbar"></div>

<div class="page-wrapper marketplace-page">
  <div class="container">
    <!-- Header -->
    <div class="mp-header">
      <h1 class="mp-title">🛒 Marketplace</h1>
      <p class="mp-desc">Mang một phần làng nghề về nhà bạn — sản phẩm thủ công chính hãng từ nghệ nhân</p>
    </div>

    <!-- Game Banner -->
    <div class="mp-game-banner" onclick="App.navigate('lobby.html')">
      <span>🎮</span>
      <div>
        <strong>Bạn có đoán được sản phẩm này từ làng nghề nào không?</strong>
        <p>Chơi game Đoán Làng Nghề ngay!</p>
      </div>
      <span class="mp-banner-arrow">⟶</span>
    </div>

    <!-- Filters -->
    <div class="mp-filters" id="mp-filters">
      <button class="mp-filter active" data-cat="all">Tất cả</button>
      <button class="mp-filter" data-cat="gom-su">🏺 Gốm sứ</button>
      <button class="mp-filter" data-cat="det-lua">🧵 Dệt lụa</button>
      <button class="mp-filter" data-cat="tranh-dan-gian">🎨 Tranh</button>
      <button class="mp-filter" data-cat="may-tre-dan">🪨 Mây tre</button>
      <button class="mp-filter" data-cat="duc-dong">🔔 Đúc đồng</button>
      <button class="mp-filter" data-cat="non-la">👒 Nón lá</button>
      <button class="mp-filter" data-cat="da-my-nghe">💎 Đá</button>
      <button class="mp-filter" data-cat="trong-hoa">🌸 Hoa</button>
    </div>

    <!-- Products Grid -->
    <div class="mp-grid" id="mp-grid">
      <!-- Filled by JS -->
    </div>
  </div>
</div>

<!-- Product Detail Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box product-modal-box">
    <button class="modal-close" onclick="closeProductModal()">✕</button>
    <div class="product-modal-content" id="product-modal-content">
      <!-- Filled by JS -->
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  let currentFilter = 'all';

  document.addEventListener('DOMContentLoaded', () => {
    App.renderNavbar('marketplace');
    renderProducts('all');

    // Filter buttons
    document.querySelectorAll('.mp-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mp-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.cat;
        renderProducts(currentFilter);
      });
    });
  });

  function renderProducts(category) {
    const grid = document.getElementById('mp-grid');
    let products = getAllProducts();
    if (category !== 'all') products = products.filter(p => p.category === category);

    grid.innerHTML = '';
    if (products.length === 0) {
      grid.innerHTML = '<div class="mp-empty">Chưa có sản phẩm trong danh mục này</div>';
      return;
    }

    products.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'mp-card';
      card.style.animationDelay = `${i * 0.06}s`;
      card.innerHTML = `
        <div class="mp-card-img" style="background-image:url('${p.image}')">
          <div class="mp-card-badge">${p.villageName}</div>
        </div>
        <div class="mp-card-body">
          <h3 class="mp-card-name">${p.name}</h3>
          <p class="mp-card-artisan">👤 ${p.artisan}</p>
          <div class="mp-card-footer">
            <span class="mp-card-price">${formatPrice(p.price)}</span>
            <button class="btn btn-sm btn-primary" onclick="openProductModal('${p.id}')">Xem</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function openProductModal(productId) {
    const p = getProductById(productId);
    if (!p) return;
    const modal = document.getElementById('product-modal');
    const content = document.getElementById('product-modal-content');
    const village = getVillageById(p.villageId);

    content.innerHTML = `
      <div class="product-detail-img" style="background-image:url('${p.image}')"></div>
      <div class="product-detail-body">
        <span class="product-detail-village">📍 ${p.villageName} — ${p.location}</span>
        <h2 class="product-detail-name">${p.name}</h2>
        <p class="product-detail-artisan">Nghệ nhân: <strong>${p.artisan}</strong></p>
        <p class="product-detail-desc">${p.desc}</p>
        <div class="product-detail-price">${formatPrice(p.price)}</div>
        ${village ? `
          <div class="product-detail-village-info">
            <h4>🏮 Về ${village.name}</h4>
            <p>${village.description}</p>
            <p class="product-detail-fact">💡 ${village.funFact}</p>
          </div>
        ` : ''}
        <div class="product-detail-actions">
          <button class="btn btn-primary btn-lg" onclick="addToCart('${p.id}')">🛒 Thêm vào giỏ hàng</button>
          <button class="btn btn-secondary" onclick="closeProductModal()">Đóng</button>
        </div>
      </div>
    `;
    modal.classList.add('open');
  }

  function closeProductModal() {
    document.getElementById('product-modal').classList.remove('open');
  }

  function addToCart(productId) {
    alert('🛒 Đã thêm vào giỏ hàng! (Demo)');
    closeProductModal();
  }

  document.getElementById('product-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeProductModal();
  });
</script>
</body>
</html>
