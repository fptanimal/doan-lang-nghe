<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Bảng xếp hạng</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
<div class="bg-pattern"></div>
<div id="main-navbar"></div>

<div class="page-wrapper leaderboard-page" style="padding-top:100px;">

  <!-- Header -->
  <div class="leaderboard-header">
    <div style="font-size:3rem;margin-bottom:8px">🏆</div>
    <h1 class="leaderboard-title">Bảng Xếp Hạng</h1>
    <p style="color:var(--gray);font-size:0.95rem">Những người bảo vệ ngọn lửa văn hóa xuất sắc nhất</p>
  </div>

  <!-- Tabs -->
  <div style="display:flex;gap:8px;justify-content:center;margin-bottom:24px;">
    <button class="mp-filter active" onclick="switchTab(this,'all')">Mọi thời đại</button>
    <button class="mp-filter" onclick="switchTab(this,'today')">Hôm nay</button>
  </div>

  <!-- Top 3 podium -->
  <div id="podium" style="display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:32px;animation:slideInDown 0.6s ease-out;"></div>

  <!-- Full list -->
  <div class="leaderboard-list" id="leaderboard-list"></div>

  <!-- My position -->
  <div id="my-position" style="display:none;position:sticky;bottom:0;background:var(--cream);padding:16px;border-top:2px solid var(--gold);text-align:center;font-size:0.9rem;font-weight:600;color:var(--brown);border-radius:12px 12px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,0.08);margin-top:16px;"></div>

  <!-- My record -->
  <div id="my-record" style="display:none;margin-top:24px;padding-top:24px;border-top:1.5px dashed var(--cream-dark);">
    <h3 style="text-align:center;color:var(--brown);margin-bottom:16px;font-size:1rem;">📊 Kỷ lục của bạn</h3>
    <div class="card" style="text-align:center;">
      <div style="font-family:var(--font-display);font-size:2rem;font-weight:800;color:var(--terracotta)" id="my-high-score">0</div>
      <div style="font-size:0.8rem;color:var(--gray);margin-top:4px">Điểm cao nhất</div>
    </div>
  </div>

  <!-- CTA -->
  <div style="display:flex;gap:12px;justify-content:center;margin-top:32px;animation:slideInUp 0.6s 0.4s ease-out both;">
    <button class="btn btn-primary" onclick="App.navigate('lobby.html')">🎮 Chơi ngay</button>
    <button class="btn btn-ghost btn-sm" onclick="clearLeaderboard()">🗑️ Xoá dữ liệu</button>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.renderNavbar('leaderboard');
    renderLeaderboard('all');
    renderMyRecord();
  });

  function switchTab(btn, mode) {
    document.querySelectorAll('.mp-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderLeaderboard(mode);
  }

  function renderLeaderboard(mode) {
    let board = App.getLeaderboard();
    if (mode === 'today') {
      const today = new Date().toLocaleDateString('vi-VN');
      board = board.filter(b => b.date === today);
    }

    const list = document.getElementById('leaderboard-list');
    const podium = document.getElementById('podium');
    list.innerHTML = '';
    podium.innerHTML = '';

    if (board.length === 0) {
      list.innerHTML = `<div class="lb-empty"><div class="lb-empty-icon">🔥</div><p>Chưa có ai chơi! Bạn hãy là người đầu tiên!</p></div>`;
      return;
    }

    // Podium
    const podiumOrder = [1, 0, 2];
    const podiumHeights = [120, 160, 90];
    const podiumEmojis = ['🥈', '🥇', '🥉'];
    podiumOrder.forEach((idx, pos) => {
      const player = board[idx];
      if (!player) return;
      const div = document.createElement('div');
      div.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;animation:slideInUp 0.5s ' + (0.1+pos*0.1) + 's ease-out both;';
      div.innerHTML = `
        <div style="font-size:2rem">${podiumEmojis[pos]}</div>
        <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--terracotta),var(--gold));display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:white;font-family:var(--font-display);box-shadow:var(--shadow-md);">
          ${(player.name || '?').charAt(0).toUpperCase()}
        </div>
        <div style="font-weight:700;font-size:0.85rem;color:var(--ink);text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${player.name}</div>
        <div style="background:${pos===1?'var(--gold)':pos===0?'var(--gray-light)':'#c87533'};height:${podiumHeights[pos]}px;width:70px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;box-shadow:var(--shadow-sm);">
          <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:800;color:white;">${App.formatScore(player.score)}</div>
          <div style="font-size:0.65rem;color:rgba(255,255,255,0.8)">${player.correct||0}/${player.total||5} đúng</div>
        </div>
      `;
      podium.appendChild(div);
    });

    // List
    const user = App.getCurrentUser();
    const userName = user ? user.displayName : (App.getState().playerName || '');
    board.forEach((player, i) => {
      const isMe = player.name === userName;
      const el = document.createElement('div');
      el.className = 'lb-item';
      el.style.animationDelay = `${0.05 + i * 0.06}s`;
      if (isMe) el.style.background = 'rgba(232,184,75,0.08)';
      if (isMe) el.style.borderColor = 'var(--gold)';
      const medals = ['🥇','🥈','🥉'];
      el.innerHTML = `
        <div class="lb-rank">${medals[i] || (i + 1)}</div>
        <div class="lb-avatar">${(player.name || '?').charAt(0).toUpperCase()}</div>
        <div class="lb-info">
          <div class="lb-name">${player.name || 'Ẩn danh'}${isMe ? ' (Bạn)' : ''}</div>
          <div class="lb-detail">✅ ${player.correct || 0}/${player.total || 5} · 📅 ${player.date || ''}</div>
        </div>
        <div class="lb-score">${App.formatScore(player.score)}</div>
      `;
      list.appendChild(el);
    });

    // My position
    const myIdx = board.findIndex(p => p.name === userName);
    const posEl = document.getElementById('my-position');
    if (myIdx >= 0 && myIdx > 2) {
      posEl.style.display = 'block';
      const nextScore = myIdx > 0 ? board[myIdx-1].score - board[myIdx].score : 0;
      posEl.textContent = `Bạn đang ở vị trí #${myIdx+1} — Cần thêm ${nextScore} điểm để lên hạng`;
    }
  }

  function renderMyRecord() {
    const hs = App.getHighScore();
    if (hs > 0) {
      document.getElementById('my-record').style.display = 'block';
      document.getElementById('my-high-score').textContent = App.formatScore(hs);
    }
  }

  function clearLeaderboard() {
    if (confirm('Xoá toàn bộ bảng xếp hạng?')) {
      const state = App.getState();
      App.setState({ ...state, leaderboard: [], highScore: 0 });
      window.location.reload();
    }
  }
</script>
</body>
</html>
