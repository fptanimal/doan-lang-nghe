<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Đăng ký</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body class="dark-theme">

<div id="main-navbar"></div>

<div class="auth-page">
  <a href="index.html" class="auth-back">← QUAY LẠI TRANG CHỦ</a>

  <div class="auth-container">
    <div class="auth-logo">🔥 Làng Nghề</div>
    <div class="auth-subtitle">KHÁM PHÁ DI SẢN</div>

    <h2 class="auth-title">Tạo tài khoản</h2>
    <p class="auth-desc">Tham gia cộng đồng bảo tồn làng nghề</p>

    <button class="btn-google" onclick="googleRegister()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2a10.34 10.34 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92A8.78 8.78 0 0 0 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26a5.4 5.4 0 0 1-8.04-2.84H1.04v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M4 10.71a5.36 5.36 0 0 1 0-3.42V4.95H1.04A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04L4 10.72z"/><path fill="#EA4335" d="M9 3.58a4.86 4.86 0 0 1 3.44 1.35l2.58-2.59A8.65 8.65 0 0 0 9 0 9 9 0 0 0 1.04 4.96L4 7.3A5.36 5.36 0 0 1 9 3.58z"/></svg>
      Đăng ký với Google
    </button>

    <div class="auth-divider"><span>HOẶC ĐĂNG KÝ VỚI EMAIL</span></div>

    <form class="auth-form" onsubmit="handleRegister(event)">
      <div class="auth-field">
        <label>TÊN HIỂN THỊ</label>
        <input type="text" id="reg-name" placeholder="Nguyễn Văn A" required maxlength="30" />
      </div>
      <div class="auth-field">
        <label>EMAIL</label>
        <input type="email" id="reg-email" placeholder="email@example.com" required />
      </div>
      <div class="auth-field">
        <label>MẬT KHẨU</label>
        <input type="password" id="reg-password" placeholder="Tối thiểu 6 ký tự" required minlength="6" />
      </div>
      <div class="auth-field">
        <label>XÁC NHẬN MẬT KHẨU</label>
        <input type="password" id="reg-password-confirm" placeholder="Nhập lại mật khẩu" required />
      </div>
      <div id="reg-error" class="auth-error"></div>
      <button type="submit" class="btn-auth-submit">TẠO TÀI KHOẢN</button>
    </form>

    <p class="auth-switch">
      Đã có tài khoản? <a href="login.html">Đăng nhập</a>
    </p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.renderNavbar('register');
    if (App.isLoggedIn()) App.navigate('lobby.html');
  });

  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pw = document.getElementById('reg-password').value;
    const pw2 = document.getElementById('reg-password-confirm').value;
    if (pw !== pw2) { document.getElementById('reg-error').textContent = 'Mật khẩu không khớp'; return; }
    const result = App.register(email, pw, name);
    if (result.success) { App.navigate('lobby.html'); }
    else { document.getElementById('reg-error').textContent = result.error; }
  }

  function googleRegister() {
    App.loginWithGoogle();
    App.navigate('lobby.html');
  }
</script>
</body>
</html>
