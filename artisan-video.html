<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làng Nghề — Chuyện Nghề</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/pages2.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body class="dark-theme">
<div class="bg-pattern" style="opacity: 0.2;"></div>
<div id="main-navbar"></div>

<div class="page-wrapper" style="padding-top:80px; min-height:100vh;">
  <div class="container" style="max-width:900px; padding-bottom: 60px;">
    
    <a href="javascript:history.back()" style="display:inline-block; color:rgba(255,255,255,0.5); text-decoration:none; margin-bottom:20px; font-weight:600; font-size:0.85rem;">← Quay lại</a>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
      <h1 style="font-family:var(--font-display); font-size:2.2rem; color:var(--gold); margin:0;">🎥 Video Nghệ Nhân</h1>
    </div>

    <!-- Videos Gallery -->
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 32px;">
      
      <!-- Gốm Bát Tràng -->
      <div style="background:rgba(20,15,10,0.6); border:1px solid rgba(232,184,75,0.3); border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
        <h2 style="color:var(--gold); font-family:var(--font-display); font-size:1.5rem; margin:0;">Nghệ nhân Gốm Bát Tràng</h2>
        <div style="width:100%; border-radius:16px; overflow:hidden; aspect-ratio: 16/9; background:#000;">
          <iframe src="https://www.youtube.com/embed/ljR0F5J_vPM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="width:100%; height:100%;"></iframe>
        </div>
      </div>

      <!-- Mây tre đan Phú Vinh -->
      <div style="background:rgba(20,15,10,0.6); border:1px solid rgba(232,184,75,0.3); border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
        <h2 style="color:var(--gold); font-family:var(--font-display); font-size:1.5rem; margin:0;">Nghệ nhân Mây tre đan Phú Vinh</h2>
        <div style="width:100%; border-radius:16px; overflow:hidden; aspect-ratio: 16/9; background:#000;">
          <iframe src="https://www.youtube.com/embed/MW-88Rn9A_0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="width:100%; height:100%;"></iframe>
        </div>
      </div>

      <!-- Lụa Vạn Phúc -->
      <div style="background:rgba(20,15,10,0.6); border:1px solid rgba(232,184,75,0.3); border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
        <h2 style="color:var(--gold); font-family:var(--font-display); font-size:1.5rem; margin:0;">Nghệ nhân Lụa Vạn Phúc</h2>
        <div style="width:100%; border-radius:16px; overflow:hidden; aspect-ratio: 16/9; background:#000;">
          <iframe src="https://www.youtube.com/embed/ubxDksPw_lg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="width:100%; height:100%;"></iframe>
        </div>
      </div>

      <!-- Đá mỹ nghệ Non Nước -->
      <div style="background:rgba(20,15,10,0.6); border:1px solid rgba(232,184,75,0.3); border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
        <h2 style="color:var(--gold); font-family:var(--font-display); font-size:1.5rem; margin:0;">Nghệ nhân Đá Non Nước</h2>
        <div style="width:100%; border-radius:16px; overflow:hidden; aspect-ratio: 16/9; background:#000;">
          <iframe src="https://www.youtube.com/embed/vz0-NhjVTgI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="width:100%; height:100%;"></iframe>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    App.renderNavbar('home'); // Giữ active ở home hoặc không
  });
</script>
</body>
</html>
